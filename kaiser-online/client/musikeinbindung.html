<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Einbindungstest Musik</title>
<style>body{background:#111;color:#fff;font-family:monospace;padding:16px}
pre{background:#000;padding:10px;border:1px solid #555}</style></head>
<body>
<h3>Prüft genau den Weg, den der Musikknopf im Spiel geht</h3>
<pre id="a">läuft...</pre>
<script type="module">
const zeilen = [];
const sag = t => { zeilen.push(t); document.getElementById('a').textContent = zeilen.join('\n'); };
try {
  const musik = await import('./sid.js');
  sag('sid.js geladen');
  const info = await musik.musikLaden('assets/kaiser_titel.sid', { neustartNachAufrufen: 2688 });
  sag('Musik geladen: ' + JSON.stringify(info));
  musik.lautstaerke(0.35);
  // Ohne Web Audio rechnen, das geht auch ohne Nutzeraktion
  const proben = musik.rendern(4, 44100);
  let summe = 0, min = 1, max = -1, nulldurchgaenge = 0;
  for (let i = 0; i < proben.length; i++) {
    const v = proben[i];
    summe += v * v; if (v < min) min = v; if (v > max) max = v;
    if (i && ((proben[i - 1] < 0) !== (v < 0))) nulldurchgaenge++;
  }
  const rms = Math.sqrt(summe / proben.length);
  sag(`4 Sekunden gerechnet: ${proben.length} Werte`);
  sag(`Effektivwert ${rms.toFixed(4)}, min ${min.toFixed(4)}, max ${max.toFixed(4)}`);
  sag(`Nulldurchgänge ${nulldurchgaenge}`);
  sag(rms > 0.01 ? 'ERGEBNIS: Ton vorhanden' : 'ERGEBNIS: STILL - Fehler');
  // Schleife pruefen: nach 33,5 s muss wieder Ton kommen
  const lang = musik.rendern(40, 22050);
  const ende = lang.subarray(lang.length - 22050 * 3);
  let s2 = 0; for (const v of ende) s2 += v * v;
  const rmsEnde = Math.sqrt(s2 / ende.length);
  sag(`Effektivwert der letzten 3 Sekunden von 40: ${rmsEnde.toFixed(4)}`);
  sag(rmsEnde > 0.01 ? 'ERGEBNIS: Schleife laeuft weiter' : 'ERGEBNIS: nach dem Ende still');
} catch (e) {
  sag('FEHLER: ' + e.message);
}
</script></body></html>
